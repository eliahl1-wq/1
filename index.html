    <script>
      // Keep the canonical host consistent before the application loads.
      if (location.hostname === 'www.arenifi.fun') {
        location.replace('https://arenifi.fun' + location.pathname + location.search + location.hash);
      }

      // Recover once when route HTML outlives its hashed deployment assets.
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT' || !target.src || target.src.indexOf('/assets/') === -1) return;
        var refreshKey = 'arenifi-asset-refresh';
        if (sessionStorage.getItem(refreshKey)) return;
        sessionStorage.setItem(refreshKey, '1');
        var separator = location.search ? '&' : '?';
        location.replace(location.pathname + location.search + separator + 'asset-refresh=' + Date.now() + location.hash);
      }, true);
      window.addEventListener('load', function () {
        sessionStorage.removeItem('arenifi-asset-refresh');
      });
    </script>
