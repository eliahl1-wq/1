<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surviv interior prop preview</title>
  <style>
    html, body { margin: 0; width: 100%; min-height: 100%; background: #17211d; color: #e9efe9; font: 12px system-ui, sans-serif; }
    canvas { display: block; width: 1200px; height: 920px; margin: 20px auto; background: #4d554d; }
  </style>
</head>
<body>
  <canvas id="preview" width="1200" height="920"></canvas>
  <script type="module">
    import { SurvivRenderer } from '/src/game/surviv/SurvivRenderer.js';
    const canvas = document.querySelector('#preview');
    const ctx = canvas.getContext('2d');
    const renderer = new SurvivRenderer(canvas);
    renderer.pause();
    renderer._frameNow = performance.now();
    const groups = [
      {
        title: 'DOMESTIC', x: 24, y: 24, w: 1152, h: 420, floor: '#7c7568',
        variants: ['sofa','armchair','coffeeTable','floorLamp','housePlant','bed','bunkBed','nightstand','dresser','wardrobe','sideboard','entryBench','diningTable','desk','bookshelf','kitchenCounter','bathtub','vanity','toilet'],
      },
      {
        title: 'INDUSTRIAL / LAB / SERVICE', x: 24, y: 468, w: 1152, h: 428, floor: '#515c5b',
        variants: ['salesCounter','displayShelf','storageShelf','workbench','toolCabinet','locker','medicalCabinet','ammoLocker','labBench','specimenTank','serverRack','generator','weaponRack','mapTable','controlConsole','palletStack','hospitalBed','prisonBench'],
      },
    ];
    for (const group of groups) {
      ctx.fillStyle = 'rgba(4, 8, 7, .35)'; ctx.fillRect(group.x + 8, group.y + 10, group.w, group.h);
      ctx.fillStyle = group.floor; ctx.fillRect(group.x, group.y, group.w, group.h);
      ctx.strokeStyle = '#202927'; ctx.lineWidth = 8; ctx.strokeRect(group.x, group.y, group.w, group.h);
      ctx.fillStyle = 'rgba(244, 239, 218, .9)'; ctx.font = '700 14px system-ui'; ctx.fillText(group.title, group.x + 18, group.y + 27);
      group.variants.forEach((variant, index) => {
        const cols = 6;
        const col = index % cols;
        const row = Math.floor(index / cols);
        const cellW = group.w / cols;
        const cellH = 94;
        const x = group.x + cellW * (col + .5);
        const y = group.y + 72 + cellH * row;
        const tall = ['bed','bunkBed','wardrobe','bookshelf','displayShelf','storageShelf','serverRack','locker','medicalCabinet','ammoLocker','weaponRack'].includes(variant);
        const round = ['floorLamp','housePlant','toilet','specimenTank'].includes(variant);
        const wide = ['sofa','diningTable','desk','kitchenCounter','salesCounter','workbench','labBench','generator','mapTable','controlConsole','palletStack','hospitalBed','prisonBench'].includes(variant);
        const obstacle = {
          id: `preview-${variant}`, kind: 'furniture', variant, x, y,
          w: round ? 42 : wide ? 104 : tall ? 42 : 62,
          h: round ? 42 : wide ? 48 : tall ? 76 : 48,
          collidable: true, destructible: true, maxHp: 50,
          hp: index % 5 === 4 ? 18 : 50,
          _insideHouseId: group.title,
        };
        renderer.drawObstacle(ctx, obstacle, false);
        ctx.fillStyle = 'rgba(9, 14, 12, .76)';
        ctx.fillRect(x - 72, y + 43, 144, 20);
        ctx.fillStyle = '#edf1eb'; ctx.font = '600 11px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(variant, x, y + 57);
      });
    }
    ctx.textAlign = 'start';
    renderer.destroy();
  </script>
</body>
</html>
